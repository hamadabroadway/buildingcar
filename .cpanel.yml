---
deployment:
  tasks:
    - /bin/rm -f $HOME/public_html/index.php
    - /bin/rm -f $HOME/public_html/index.htm
    - /bin/rm -f $HOME/public_html/default.html
    - /bin/rm -rf $HOME/public_html/images
    - /bin/cp index.html $HOME/public_html/
    - /bin/cp style.css $HOME/public_html/
    - /bin/cp script.js $HOME/public_html/
    - /bin/cp .htaccess $HOME/public_html/
    - /bin/cp -R images $HOME/public_html/
